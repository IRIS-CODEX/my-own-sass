  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Enterprise AI Agent Governance, Observability, and Virtual Key Gateway command center with Human-In-The-Loop steering, real-time control tower, policy studio, and security compliance." />
    <meta property="og:title" content="Agent Lens — AI Agent Governance, Observability & Virtual Key Gateway" />
    <meta property="og:description" content="Enterprise AI Agent Governance, Observability, and Virtual Key Gateway command center with Human-In-The-Loop steering, real-time control tower, policy studio, and security compliance." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('agentlens_theme');
          var isDark = saved ? saved === 'dark' : true;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}

        // Gracefully ignore benign Vite dev server websocket disconnection messages in sandbox
        function isBenignWsError(err) {
          if (!err) return false;
          var str = '';
          try {
            if (typeof err === 'string') {
              str = err;
            } else if (err.message) {
              str = err.message + ' ' + (err.stack || '');
            } else if (err.reason) {
              str = typeof err.reason === 'string' ? err.reason : (err.reason.message || String(err.reason));
            } else {
              str = String(err);
            }
          } catch(e) {
            str = String(err);
          }
          return (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('websocket') !== -1 ||
            str.indexOf('failed to connect to websocket') !== -1 ||
            str.indexOf('WebSocket closed without opened') !== -1 ||
            str.indexOf('ws://') !== -1 ||
            str.indexOf('wss://') !== -1
          );
        }

        var _origError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) { 
            try { return typeof a === 'string' ? a : (a && a.message) || JSON.stringify(a) || String(a); } catch(e) { return String(a); }
          }).join(' ');
          if (isBenignWsError(joined)) return;
          _origError.apply(console, arguments);
        };

        var _origWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) { 
            try { return typeof a === 'string' ? a : (a && a.message) || JSON.stringify(a) || String(a); } catch(e) { return String(a); }
          }).join(' ');
          if (isBenignWsError(joined)) return;
          _origWarn.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (event && isBenignWsError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (event && (isBenignWsError(event.error) || isBenignWsError(event.message))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-[#faf8f5] dark:bg-[#181715] text-[#1f1e1b] dark:text-[#f5f3ef] antialiased selection:bg-amber-500/20 selection:text-amber-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
